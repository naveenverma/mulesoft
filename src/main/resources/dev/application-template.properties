# =============================================================================
# DEV Environment Configuration
# =============================================================================
# Copy to src/main/resources/dev/application.properties and fill in values.
# DO NOT commit this file to version control.
# =============================================================================

# --- SKY API Authentication (Placeholders) ---
sky.api.client.id=${CLIENT_ID}
sky.api.client.secret=${CLIENT_SECRET}
sky.api.subscription.key=${SUBSCRIPTION_KEY}
sky.api.refresh.token=${REFRESH_TOKEN}

# --- SKY API Endpoints ---
sky.api.auth.url=https://oauth2.sky.blackbaud.com/token
sky.api.base.url=https://api.sky.blackbaud.com/fe/general-ledger
sky.api.timeout.ms=30000
sky.api.retry.count=3
sky.api.retry.delay.ms=1000

# --- DEV Overrides ---
http.port=8081
batch.size=100
processing.mode=BATCH
environment=DEV

# --- Mock Mode (when live API access is unavailable) ---
sky.api.mock.enabled=true
sky.api.mock.response.directory=./mock-responses
