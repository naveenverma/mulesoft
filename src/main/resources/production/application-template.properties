# =============================================================================
# PRODUCTION Environment Configuration
# =============================================================================
# Copy to src/main/resources/production/application.properties and fill in values.
# DO NOT commit this file to version control.
# =============================================================================

# --- SKY API Authentication (Placeholders) ---
sky.api.client.id=${CLIENT_ID}
sky.api.client.secret=${CLIENT_SECRET}
sky.api.subscription.key=${SUBSCRIPTION_KEY}
sky.api.refresh.token=${REFRESH_TOKEN}

# --- SKY API Endpoints ---
sky.api.auth.url=https://oauth2.sky.blackbaud.com/token
sky.api.base.url=https://api.sky.blackbaud.com/fe/general-ledger
sky.api.timeout.ms=60000
sky.api.retry.count=5
sky.api.retry.delay.ms=5000

# --- PRODUCTION Overrides ---
http.port=8080
batch.size=250
processing.mode=BATCH
environment=PRODUCTION

# --- Mock Mode ---
sky.api.mock.enabled=false
