# =============================================================================
# MuleSoft GL Integration - Global Application Configuration
# =============================================================================
# Environment: ${environment}
# =============================================================================

# --- Environment ---
environment=DEV

# --- HTTP Server (Experience API) ---
http.port=8081
http.host=0.0.0.0
http.basePath=/api/v1/gl

# --- Batch Processing ---
batch.size=100
processing.mode=BATCH
retry.count=3
timeout.ms=30000

# --- CSV Input ---
csv.input.directory=./input
csv.archive.directory=./archive
csv.error.directory=./error
csv.file.pattern=*.csv

# --- Output Status ---
output.status.directory=./status

# --- Logging ---
logging.level.root=INFO
logging.level.com.mulesoft.integration=DEBUG
logging.appenders.console.enabled=true
logging.appenders.file.enabled=true
logging.appenders.file.path=./logs
logging.appenders.file.maxHistory=30
logging.appenders.file.totalSizeCap=500MB
