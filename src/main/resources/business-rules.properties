# =============================================================================
# Business Rules Configuration
# =============================================================================
# All rules are configurable. Modify values here to change behavior without
# redeploying flows (when used with external property sources).
# =============================================================================

# --- Rule 1: Amount Validation ---
# Reject records where Amount <= threshold
rule.amount.rejection.enabled=true
rule.amount.rejection.threshold=0
rule.amount.rejection.action=REJECT

# --- Rule 2: Missing Journal ---
# Assign default journal when Journal field is missing/empty
rule.journal.default.enabled=true
rule.journal.default.value=DEFAULT_JOURNAL

# --- Rule 3: Account Validation ---
# Send records with invalid account numbers to error queue
rule.account.validation.enabled=true
rule.account.validation.action=ERROR_QUEUE

# --- Rule 4: Date Format ---
# Target date format for all date fields
rule.date.input.format=MM/dd/yyyy
rule.date.output.format=yyyy-MM-dd

# --- Rule 5: Null Value Handling ---
# Options: OMIT_FIELD, EMPTY_STRING, DEFAULT_VALUE
rule.null.handling.action=OMIT_FIELD
rule.null.default.value=

# --- Rule 6: String Trimming ---
rule.trim.strings.enabled=true

# --- Rule 7: Numeric Conversion ---
rule.numeric.safe.conversion.enabled=true
rule.numeric.default.value=0

# --- Rule 8: Batch Validation ---
rule.batch.min.records=1
rule.batch.max.records=500
